name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci is the guard, not a convenience: it fails loudly if the lockfile
      # was regenerated on macOS and lost the Linux-only optional subtrees
      # (@emnapi/*, via ESLint's WASM resolver fallback). See docs/architecture.md.
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # CI cannot see the peer repo, so it verifies the local copies are
      # unchanged since their last deliberate sync. `npm run mirror:compare`
      # (needs ../fieldagent on disk) is the human-run check for web-side drift.
      - name: Shared mirror
        run: npm run mirror:verify
